name: Daily AI Video

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install requests edge-tts moviepy==1.0.3 imageio-ffmpeg

      - name: Make Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Upload Video File
        run: |
          git config user.name "AI Bot"
          git config user.email "bot@github.com"
          git add latest_reel.mp4
          git commit -m "Update daily reel" || echo "No changes"
          git push

      - name: Send to Make.com
        run: |
          curl -X POST -H "Content-Type: application/json" -d @post_data.json ${{ secrets.MAKE_WEBHOOK_URL }}
